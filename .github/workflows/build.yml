name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: camera-man-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk camera-man.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest camera-man.apk --prerelease --title "Latest build" --notes "Built from ${{ github.sha }}"
